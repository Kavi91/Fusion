# General settings
dataset: "KITTI"
device: "cuda:0"
num_workers: 24
cuda_visible_devices: "0"
wandb_project: "FusionLIVO-STEREO"

# Modality flags
use_camera: False
use_lidar: False
use_fusion: True

# DeepVO settings (used for paths and image preprocessing)
deepvo:
  image_dir: "/home/krkavinda/Datasets/KITTI_raw/kitti_data/sequences/"
  pose_dir: "/home/krkavinda/Datasets/KITTI_raw/kitti_data/poses_7dof/"
  calib_folder: "/home/krkavinda/Datasets/KITTI_raw/kitti_data/calib/"
  timestamp_folder: "/home/krkavinda/Datasets/KITTI_raw/kitti_data/timestamp_folder"
  train_video: ["00", "01", "02", "03", "05", "08", "09"]
  valid_video: ["04", "06", "07", "10"]
  resize_mode: "rescale"
  img_h: 184
  img_w: 608
  img_means: [0.5, 0.5, 0.5]
  img_stds: [0.5, 0.5, 0.5]
  minus_point_5: True

# LoRCoN-LO settings (used for LiDAR data paths)
lorcon_lo:
  scan_folder: "/home/krkavinda/Datasets/KITTI_raw/kitti_data/scan"
  preprocessed_folder: "/home/krkavinda/Datasets/KITTI_raw/kitti_data/preprocessed_data/"
  relative_pose_folder: "/home/krkavinda/Datasets/KITTI_raw/kitti_data/relative_pose/"
  pose_folder: "/home/krkavinda/Datasets/KITTI_raw/kitti_data/poses/"
  calib_folder: "/home/krkavinda/Datasets/KITTI_raw/kitti_data/calib/"
  timestamp_folder: "/home/krkavinda/Datasets/KITTI_raw/kitti_data/timestamp_folder"
  image_width: 900
  image_height: 64
  fov_up: 3.0
  fov_down: -25.0
  proj_H: 64
  proj_W: 900
  max_range: 50
  depth_name: "depth"
  intensity_name: "intensity"
  normal_name: "normal"

# Fusion settings
fusion:
  batch_size: 32  # Updated to 16
  epochs: 250  # Updated to 250
  rnn_size: 7  # Updated to 7
  model_path: "models/fusion_model_best.pth"
  rnn_hidden_size: 1000
  dropout: 0.7
  use_autocast: False
  use_grad_scaler: False
  use_augmentation: True
  modalities:
    use_rgb_left: True
    use_rgb_right: True
    use_lidar: False
    use_depth: False
    use_intensity: False
    use_normals: False
    use_rgb_low: False
  optim:
    opt: "Adagrad"
    lr: 0.0005
    weight_decay: 1e-3
  grad_clip:
    max_norm: 5.0
  early_stopping:
    patience: 10
    min_delta: 0.001